services:
  verimarka-api:
    container_name: verimarka-api
    build:
      context: ..
      dockerfile: verimarka-BACKEND/Dockerfile
    depends_on:
      - redis
    env_file:
      - .env.prod
    environment:
      AI_MODEL_ROOT: /app/WATSON_WM/img_guard
      BLOCKCHAIN_INTEGRATION_ROOT: /app/Blockchain/backend_integration
      WAM_REPO_DIR: /app/WATSON_WM/img_guard/third_party/watermark-anything
      WAM_PARAMS_PATH: /app/WATSON_WM/img_guard/third_party/watermark-anything/checkpoints/params.json
      WAM_CHECKPOINT_PATH: /app/WATSON_WM/img_guard/models/wam/wam_mit.pth
    expose:
      - "8000"
    restart: unless-stopped

  verimarka-celery:
    container_name: verimarka-celery
    build:
      context: ..
      dockerfile: verimarka-BACKEND/Dockerfile
    depends_on:
      - redis
    env_file:
      - .env.prod
    environment:
      AI_MODEL_ROOT: /app/WATSON_WM/img_guard
      BLOCKCHAIN_INTEGRATION_ROOT: /app/Blockchain/backend_integration
      WAM_REPO_DIR: /app/WATSON_WM/img_guard/third_party/watermark-anything
      WAM_PARAMS_PATH: /app/WATSON_WM/img_guard/third_party/watermark-anything/checkpoints/params.json
      WAM_CHECKPOINT_PATH: /app/WATSON_WM/img_guard/models/wam/wam_mit.pth
    working_dir: /app/verimarka-BACKEND
    command: celery -A config worker -l info -Q ai,default
    restart: unless-stopped

  redis:
    container_name: verimarka-redis
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped

  verimarka-nginx:
    container_name: verimarka-nginx
    image: nginx:alpine
    depends_on:
      - verimarka-api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../verimarka-FRONTEND/verimarka-frontend/dist:/usr/share/nginx/html:ro
      - ../verimarka-admin-frontend/dist:/usr/share/nginx/admin:ro
      - ./deploy/certbot/www:/var/www/certbot:ro
      - ./deploy/certbot/conf:/etc/letsencrypt:ro
    restart: unless-stopped

  certbot:
    image: certbot/certbot:latest
    volumes:
      - ./deploy/certbot/www:/var/www/certbot
      - ./deploy/certbot/conf:/etc/letsencrypt
    entrypoint: /bin/sh -c
    command: >
      "trap exit TERM;
       while :; do
         certbot renew --webroot -w /var/www/certbot --quiet;
         sleep 12h;
       done"
    restart: unless-stopped

volumes:
  redis_data:
