worker_processes  auto;

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile on;
  keepalive_timeout  65;
  send_timeout 120s;
  server_names_hash_bucket_size 128;
  server_names_hash_max_size 1024;
  limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=10r/s;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    text/xml
    application/json
    application/javascript
    application/xml
    image/svg+xml;

  upstream django_api {
    server verimarka-api:8000;
  }

  server {
    listen 80;
    server_name ec2-43-200-133-6.ap-northeast-2.compute.amazonaws.com;

    location / {
      return 301 https://verimarka.com$request_uri;
    }
  }

  server {
    listen 80;
    server_name verimarka.com www.verimarka.com admin.verimarka.com;

    location ^~ /.well-known/acme-challenge/ {
      root /var/www/certbot;
      try_files $uri =404;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name ec2-43-200-133-6.ap-northeast-2.compute.amazonaws.com;

    ssl_certificate     /etc/letsencrypt/live/verimarka.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/verimarka.com/privkey.pem;

    location / {
      return 301 https://verimarka.com$request_uri;
    }
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name verimarka.com www.verimarka.com;
    client_max_body_size 40M;

    ssl_certificate     /etc/letsencrypt/live/verimarka.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/verimarka.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    root /usr/share/nginx/html;
    index index.html;

    location ~ /\.(?!well-known/) {
      return 404;
    }

    location ~* \.(sql|ya?ml|toml|ini|env|log|bak|old|backup|swp)$ {
      return 404;
    }

    location ~* ^/(?:\.git|\.aws|wp-admin|wp-login\.php|xmlrpc\.php|phpinfo\.php|config\.(?:php|json|ya?ml)|settings\.(?:php|json)|dump\.sql|terraform\.(?:tfstate|tfvars(?:\.json)?)|composer\.(?:json|lock))$ {
      return 404;
    }

    location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|webp|svg|ico|woff2?)$ {
      expires 30d;
      try_files $uri =404;
    }

    location / {
      try_files $uri $uri/index.html /index.html;
    }

    location /admin/ {
      return 301 https://admin.verimarka.com$request_uri;
    }

    location ~ ^/api/analysis/jobs/[^/]+/stream/$ {
      proxy_pass http://django_api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
      proxy_cache off;
      gzip off;
      proxy_connect_timeout 120s;
      proxy_send_timeout 650s;
      proxy_read_timeout 650s;
      add_header X-Accel-Buffering no always;
    }

    location /api/ {
      limit_req zone=api_per_ip burst=30 nodelay;
      proxy_pass http://django_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 120s;
      proxy_send_timeout 120s;
      proxy_read_timeout 120s;
    }
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name admin.verimarka.com;
    client_max_body_size 40M;

    ssl_certificate     /etc/letsencrypt/live/verimarka.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/verimarka.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    root /usr/share/nginx/admin;
    index index.html;

    location ~ /\.(?!well-known/) {
      return 404;
    }

    location ~* \.(sql|ya?ml|toml|ini|env|log|bak|old|backup|swp)$ {
      return 404;
    }

    location ~* ^/(?:\.git|\.aws|wp-admin|wp-login\.php|xmlrpc\.php|phpinfo\.php|config\.(?:php|json|ya?ml)|settings\.(?:php|json)|dump\.sql|terraform\.(?:tfstate|tfvars(?:\.json)?)|composer\.(?:json|lock))$ {
      return 404;
    }

    location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|webp|svg|ico|woff2?)$ {
      expires 30d;
      try_files $uri =404;
    }

    location / {
      try_files $uri $uri/index.html /index.html;
    }

    location ~ ^/api/analysis/jobs/[^/]+/stream/$ {
      proxy_pass http://django_api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
      proxy_cache off;
      gzip off;
      proxy_connect_timeout 120s;
      proxy_send_timeout 650s;
      proxy_read_timeout 650s;
      add_header X-Accel-Buffering no always;
    }

    location /api/ {
      limit_req zone=api_per_ip burst=30 nodelay;
      proxy_pass http://django_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 120s;
      proxy_send_timeout 120s;
      proxy_read_timeout 120s;
    }
  }
}
