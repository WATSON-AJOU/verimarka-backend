worker_processes  auto;

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile on;
  keepalive_timeout  65;
  send_timeout 120s;

  upstream django_api {
    server verimarka-api:8000;
  }

  server {
    listen 80;
    server_name ec2-43-200-133-6.ap-northeast-2.compute.amazonaws.com;

    location / {
      return 301 https://verimarka.com$request_uri;
    }
  }

  server {
    listen 80;
    server_name verimarka.com www.verimarka.com admin.verimarka.com;

    location ^~ /.well-known/acme-challenge/ {
      root /var/www/certbot;
      try_files $uri =404;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl http2;
    server_name ec2-43-200-133-6.ap-northeast-2.compute.amazonaws.com;

    ssl_certificate     /etc/letsencrypt/live/verimarka.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/verimarka.com/privkey.pem;

    location / {
      return 301 https://verimarka.com$request_uri;
    }
  }

  server {
    listen 443 ssl http2;
    server_name verimarka.com www.verimarka.com;
    client_max_body_size 25M;

    ssl_certificate     /etc/letsencrypt/live/verimarka.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/verimarka.com/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    location / {
      try_files $uri $uri/ /index.html;
    }

    location /admin/ {
      return 301 https://admin.verimarka.com$request_uri;
    }

    location /api/ {
      proxy_pass http://django_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 120s;
      proxy_send_timeout 120s;
      proxy_read_timeout 120s;
    }
  }

  server {
    listen 443 ssl http2;
    server_name admin.verimarka.com;
    client_max_body_size 25M;

    ssl_certificate     /etc/letsencrypt/live/verimarka.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/verimarka.com/privkey.pem;

    root /usr/share/nginx/admin;
    index index.html;

    location / {
      try_files $uri $uri/ /index.html;
    }

    location /api/ {
      proxy_pass http://django_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 120s;
      proxy_send_timeout 120s;
      proxy_read_timeout 120s;
    }
  }
}
