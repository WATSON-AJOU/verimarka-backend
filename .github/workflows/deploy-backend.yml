name: Deploy Backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
      DEPLOY_HOST: ${{ secrets.BACKEND_DEPLOY_HOST }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure backend EC2 instance is running
        run: |
          set -euo pipefail

          if [ -z "${AWS_REGION}" ]; then
            echo "AWS_REGION secret is required to start the backend EC2 instance." >&2
            exit 1
          fi

          if [ -z "${EC2_INSTANCE_ID}" ]; then
            echo "EC2_INSTANCE_ID secret is required to start the EC2 instance." >&2
            exit 1
          fi

          state="$(aws ec2 describe-instances \
            --instance-ids "${EC2_INSTANCE_ID}" \
            --query 'Reservations[0].Instances[0].State.Name' \
            --output text)"

          case "${state}" in
            running)
              echo "Backend EC2 instance is already running."
              ;;
            stopped)
              echo "Starting EC2 instance ${EC2_INSTANCE_ID}."
              aws ec2 start-instances --instance-ids "${EC2_INSTANCE_ID}" >/dev/null
              ;;
            stopping)
              echo "Backend EC2 instance is stopping. Waiting before start."
              aws ec2 wait instance-stopped --instance-ids "${EC2_INSTANCE_ID}"
              aws ec2 start-instances --instance-ids "${EC2_INSTANCE_ID}" >/dev/null
              ;;
            pending)
              echo "Backend EC2 instance is already starting."
              ;;
            *)
              echo "Backend EC2 instance is in unsupported state: ${state}" >&2
              exit 1
              ;;
          esac

          aws ec2 wait instance-running --instance-ids "${EC2_INSTANCE_ID}"
          aws ec2 wait instance-status-ok --instance-ids "${EC2_INSTANCE_ID}"

          if [ -z "${DEPLOY_HOST}" ]; then
            resolved_host="$(aws ec2 describe-instances \
              --instance-ids "${EC2_INSTANCE_ID}" \
              --query 'Reservations[0].Instances[0].PublicDnsName' \
              --output text)"

            if [ -z "${resolved_host}" ] || [ "${resolved_host}" = "None" ]; then
              resolved_host="$(aws ec2 describe-instances \
                --instance-ids "${EC2_INSTANCE_ID}" \
                --query 'Reservations[0].Instances[0].PublicIpAddress' \
                --output text)"
            fi

            if [ -z "${resolved_host}" ] || [ "${resolved_host}" = "None" ]; then
              echo "Could not resolve a public host for backend EC2 instance." >&2
              exit 1
            fi

            echo "DEPLOY_HOST=${resolved_host}" >> "${GITHUB_ENV}"
          fi

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.BACKEND_DEPLOY_SSH_KEY }}

      - name: Add deploy host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${DEPLOY_PORT:-22}" -H "${DEPLOY_HOST}" >> ~/.ssh/known_hosts
        env:
          DEPLOY_PORT: ${{ secrets.BACKEND_DEPLOY_PORT }}

      - name: Deploy backend with docker compose
        env:
          DEPLOY_PORT: ${{ secrets.BACKEND_DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.BACKEND_DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.BACKEND_DEPLOY_PATH }}
          DEPLOY_BRANCH: ${{ secrets.BACKEND_DEPLOY_BRANCH }}
          HEALTHCHECK_URL: ${{ secrets.BACKEND_HEALTHCHECK_URL }}
          HEALTHCHECK_RETRIES: ${{ secrets.BACKEND_HEALTHCHECK_RETRIES }}
          HEALTHCHECK_INTERVAL_SECONDS: ${{ secrets.BACKEND_HEALTHCHECK_INTERVAL_SECONDS }}
        run: |
          ssh -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" "export DEPLOY_PATH='${DEPLOY_PATH}' DEPLOY_BRANCH='${DEPLOY_BRANCH:-main}' HEALTHCHECK_URL='${HEALTHCHECK_URL:-https://verimarka.com/api/health/}' HEALTHCHECK_RETRIES='${HEALTHCHECK_RETRIES:-30}' HEALTHCHECK_INTERVAL_SECONDS='${HEALTHCHECK_INTERVAL_SECONDS:-5}'; bash -s" <<'EOF'
          set -euo pipefail
          export DOCKER_BUILDKIT=1
          export COMPOSE_DOCKER_CLI_BUILD=1

          rollback_executed=0

          refresh_proxy() {
            local nginx_container_id
            nginx_container_id="$(docker compose -f docker-compose.prod.yml ps -q verimarka-nginx 2>/dev/null || true)"
            if [ -z "${nginx_container_id}" ]; then
              echo "verimarka-nginx is not running yet; skipping nginx reload."
              return 0
            fi
            docker compose -f docker-compose.prod.yml exec -T verimarka-nginx nginx -t
            docker compose -f docker-compose.prod.yml exec -T verimarka-nginx nginx -s reload
          }

          print_diagnostics() {
            echo "::group::docker compose ps"
            docker compose -f docker-compose.prod.yml ps || true
            echo "::endgroup::"

            echo "::group::verimarka-api logs"
            docker compose -f docker-compose.prod.yml logs --tail=200 verimarka-api || true
            echo "::endgroup::"

            echo "::group::verimarka-nginx logs"
            docker compose -f docker-compose.prod.yml logs --tail=100 verimarka-nginx || true
            echo "::endgroup::"
          }

          ensure_certbot_state_present() {
            local missing=0
            local cert_path
            while IFS= read -r cert_path; do
              local host_path="deploy/certbot/conf${cert_path#/etc/letsencrypt}"
              if [ ! -e "${host_path}" ]; then
                echo "Missing LetsEncrypt file required by nginx: ${host_path}" >&2
                missing=1
              fi
            done < <(awk '/ssl_certificate(_key)?[[:space:]]+/ { value=$2; sub(/;$/, "", value); print value }' deploy/nginx/nginx.conf | sort -u)

            if [ "${missing}" -ne 0 ]; then
              echo "Refusing to recreate or reload nginx because it would break HTTPS." >&2
              return 1
            fi
          }

          clean_tracked_certbot_state() {
            git checkout -- deploy/certbot/conf deploy/certbot/www 2>/dev/null || true
          }

          run_api_healthcheck() {
            local retries="${HEALTHCHECK_RETRIES:-30}"
            local interval="${HEALTHCHECK_INTERVAL_SECONDS:-5}"
            local attempt

            for attempt in $(seq 1 "${retries}"); do
              if docker compose -f docker-compose.prod.yml exec -T verimarka-api \
                python -c "import urllib.request; req = urllib.request.Request('http://127.0.0.1:8000/api/health/', headers={'Host': 'verimarka.com'}); urllib.request.urlopen(req, timeout=10).read()" >/dev/null 2>&1; then
                echo "API healthcheck passed on attempt ${attempt}/${retries}"
                return 0
              fi
              echo "API healthcheck failed on attempt ${attempt}/${retries}"
              sleep "${interval}"
            done

            return 1
          }

          run_public_healthcheck() {
            if [ -z "${HEALTHCHECK_URL}" ]; then
              return 0
            fi

            local retries="${HEALTHCHECK_RETRIES:-30}"
            local interval="${HEALTHCHECK_INTERVAL_SECONDS:-5}"
            local attempt

            for attempt in $(seq 1 "${retries}"); do
              if curl -fsS --max-time 10 "${HEALTHCHECK_URL}" >/dev/null; then
                echo "Public healthcheck passed on attempt ${attempt}/${retries}"
                return 0
              fi
              echo "Public healthcheck failed on attempt ${attempt}/${retries}"
              sleep "${interval}"
            done

            return 1
          }

          rollback() {
            if [ "${rollback_executed}" -eq 1 ]; then
              return
            fi

            trap - ERR
            rollback_executed=1
            echo "Deployment failed. Rolling back to ${PREVIOUS_SHA}"
            git fetch origin
            clean_tracked_certbot_state
            git checkout "${PREVIOUS_SHA}"
            ensure_certbot_state_present
            docker compose -f docker-compose.prod.yml up -d --build
            refresh_proxy
          }

          trap 'status=$?; print_diagnostics; rollback; exit "${status}"' ERR

          cd "${DEPLOY_PATH}"
          PREVIOUS_SHA="$(git rev-parse HEAD)"

          clean_tracked_certbot_state
          git fetch origin
          git checkout "${DEPLOY_BRANCH}"
          git pull --ff-only origin "${DEPLOY_BRANCH}"
          ensure_certbot_state_present

          docker compose -f docker-compose.prod.yml up -d --build
          docker compose -f docker-compose.prod.yml up -d --force-recreate --no-deps verimarka-nginx
          refresh_proxy
          run_api_healthcheck
          run_public_healthcheck
          EOF
