services:
  db:
    image: postgres:16
    container_name: watson-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-watson}
      POSTGRES_USER: ${POSTGRES_USER:-watson}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      TZ: Asia/Seoul
    ports:
      - "5433:5432" 
    volumes:
      - watson_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: watson-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - watson_redisdata:/data

volumes:
  watson_pgdata:
  watson_redisdata:
